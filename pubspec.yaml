name: genoin_hdtv
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  video_player: ^2.9.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  file_picker: ^8.1.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/ico.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "ico.png"
  remove_alpha_ios: true
